<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <pattern id="bpGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#181C24" stroke-width="0.7" />
    </pattern>
    <style>
      .playhead { animation: runHead 7s linear infinite; }
      .vu1 { animation: vuBounce 0.9s ease-in-out infinite alternate; }
      .vu2 { animation: vuBounce 0.7s ease-in-out 0.2s infinite alternate; }
      .scope-pulse { animation: scopeShift 3.6s ease-in-out infinite; }
      @keyframes runHead {
        0% { transform: translateX(0px); }
        100% { transform: translateX(780px); }
      }
      @keyframes vuBounce {
        0% { height: 22px; y: 128px; }
        100% { height: 76px; y: 74px; }
      }
      @keyframes scopeShift {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  
